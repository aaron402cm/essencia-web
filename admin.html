<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Essência Perfumería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0f19; color: #fdfbf7; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-8">
        <!-- HEADER -->
        <div class="flex justify-between items-center border-b border-[#d4af37]/20 pb-6">
            <div>
                <h1 class="text-3xl font-serif text-[#d4af37]">Panel de Control</h1>
                <p class="text-sm text-gray-400">Administración general - Essência</p>
            </div>
            <a href="index.html" class="bg-[#131b2e] border border-[#d4af37]/40 text-[#d4af37] px-4 py-2 rounded-xl text-sm hover:bg-[#d4af37]/10 transition">Ver Tienda Web ↗</a>
        </div>

        <!-- PESTAÑAS EN UNA SOLA LÍNEA -->
        <div class="flex flex-row gap-2 border-b border-gray-800 pb-4 overflow-x-auto">
            <button onclick="switchTab('form-tab')" id="btn-form-tab" class="px-5 py-2.5 rounded-xl font-semibold bg-[#d4af37] text-black transition whitespace-nowrap">➕ Nuevo Producto</button>
            <button onclick="switchTab('promo-tab')" id="btn-promo-tab" class="px-5 py-2.5 rounded-xl font-semibold bg-[#131b2e] text-gray-300 hover:text-white transition whitespace-nowrap">📢 Banners y Carrusel</button>
            <button onclick="switchTab('inventory-tab')" id="btn-inventory-tab" class="px-5 py-2.5 rounded-xl font-semibold bg-[#131b2e] text-gray-300 hover:text-white transition whitespace-nowrap">📦 Inventario</button>
        </div>

        <!-- VISTA 1: NUEVO / EDITAR PRODUCTO -->
        <div id="form-tab" class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
            <h2 id="form-title" class="text-xl font-serif text-[#f3e7c4] mb-4">🛍️ Registrar Producto o Artículo</h2>
            <form onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nombre del Producto *</label>
                    <input type="text" id="prod-name" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Marca / Proveedor *</label>
                    <select id="prod-brand" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                        <option value="Natura">Natura</option>
                        <option value="Ésika">Ésika</option>
                        <option value="L'Bel">L'Bel</option>
                        <option value="Cyzone">Cyzone</option>
                        <option value="Yanbal">Yanbal</option>
                        <option value="General">General / Otro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Categoría *</label>
                    <select id="prod-cat" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                        <option value="Perfumes">Perfumes</option>
                        <option value="Maquillaje">Maquillaje</option>
                        <option value="Cuidado Personal">Cuidado Personal</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Electrodomésticos">Electrodomésticos</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Actual / Oferta (S/) *</label>
                    <input type="number" step="0.01" id="prod-price" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Anterior / Tachado S/ (Opcional)</label>
                    <input type="number" step="0.01" id="prod-old-price" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]" placeholder="Ej. 150.00">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Stock Disponible</label>
                    <input type="number" id="prod-stock" value="10" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Tallas Disponibles (Opcional)</label>
                    <input type="text" id="prod-sizes" placeholder="Ej. S, M, L" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Colores Disponibles (Opcional)</label>
                    <input type="text" id="prod-colors" placeholder="Ej. Rojo, Negro" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div class="md:col-span-2 border-t border-gray-800 pt-4">
                    <label class="block text-xs text-[#d4af37] font-bold mb-1">📸 Foto Principal de Portada</label>
                    <input type="file" id="prod-main-file" accept="image/*" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white file:bg-[#d4af37] file:text-black file:rounded-lg file:border-0 file:px-3 file:py-1">
                    <input type="hidden" id="prod-existing-main">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">📸 Fotos Adicionales para la Galería (Opcional)</label>
                    <input type="file" id="prod-gallery-files" accept="image/*" multiple class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white file:bg-gray-700 file:text-white file:rounded-lg file:border-0 file:px-3 file:py-1">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">Descripción Breve</label>
                    <textarea id="prod-desc" rows="2" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]"></textarea>
                </div>
                <div class="md:col-span-2 flex space-x-3 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-[#d4af37] text-black font-semibold py-3 rounded-xl hover:bg-[#f3e7c4] transition shadow-lg">Guardar y Publicar en la Web</button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-700 text-white px-6 py-3 rounded-xl hover:bg-gray-600 transition">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- VISTA 2: BANNERS Y CARRUSEL -->
        <div id="promo-tab" class="hidden space-y-6">
            <!-- Creador / Editor de Carrusel -->
            <div class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
                <h2 id="promo-form-title" class="text-xl font-serif text-[#f3e7c4] mb-4">📢 Crear / Editar Banner del Carrusel</h2>
                <form onsubmit="savePromo(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="promo-id">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Título (Ej. ¡Cyber Essência!)</label>
                        <input type="text" id="promo-title" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Subtítulo (Ej. HASTA 60% OFF)</label>
                        <input type="text" id="promo-subtitle" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Precio Anterior S/ (Opcional)</label>
                        <input type="number" step="0.01" id="promo-old" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Precio Oferta S/ (Opcional)</label>
                        <input type="number" step="0.01" id="promo-new" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs text-[#d4af37] font-bold mb-1">📸 Imagen del Banner (Se comprimirá automáticamente)</label>
                        <input type="file" id="promo-file" accept="image/*" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white file:bg-[#d4af37] file:text-black file:rounded-lg file:border-0 file:px-3 file:py-1">
                        <input type="hidden" id="promo-existing-img">
                    </div>
                    <div class="md:col-span-2 flex space-x-3 pt-2">
                        <button type="submit" id="btn-promo-save" class="flex-1 bg-[#d4af37] text-black font-semibold py-3 rounded-xl hover:bg-[#f3e7c4] transition">Guardar Banner en Carrusel</button>
                        <button type="button" id="btn-promo-cancel" onclick="resetPromoForm()" class="hidden bg-gray-700 text-white px-6 py-3 rounded-xl hover:bg-gray-600 transition">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Listado de Banners del Carrusel Activos -->
            <div class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">📋 Banners del Carrusel Actuales</h2>
                <div id="admin-promos-list" class="space-y-3"><p class="text-gray-400 text-center">Cargando...</p></div>
            </div>
        </div>

        <!-- VISTA 3: INVENTARIO CON FECHA -->
        <div id="inventory-tab" class="hidden bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">📦 Historial e Inventario Actual</h2>
            <div id="admin-products-list" class="space-y-3"><p class="text-gray-400 text-center py-6">Cargando inventario...</p></div>
        </div>
    </div>

    <!-- Supabase SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        function switchTab(tabId) {
            ['form-tab', 'promo-tab', 'inventory-tab'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById('btn-' + id).className = 'px-5 py-2.5 rounded-xl font-semibold bg-[#131b2e] text-gray-300 hover:text-white transition whitespace-nowrap';
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = 'px-5 py-2.5 rounded-xl font-semibold bg-[#d4af37] text-black transition whitespace-nowrap';

            if(tabId === 'inventory-tab') loadAdminProducts();
            if(tabId === 'promo-tab') loadAdminPromos();
        }

        async function compressImage(file, maxWidth = 900, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(new File([blob], file.name, { type: 'image/jpeg' })); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        // GUARDAR O EDITAR PRODUCTOS
        async function saveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.innerText = 'Guardando...'; btn.disabled = true;
            try {
                const id = document.getElementById('prod-id').value;
                const fileInput = document.getElementById('prod-main-file');
                let imageUrl = document.getElementById('prod-existing-main').value;

                if (fileInput.files.length > 0) {
                    const optimized = await compressImage(fileInput.files[0]);
                    const fileName = `${Date.now()}-${optimized.name}`;
                    await db.storage.from('product-images').upload(fileName, optimized);
                    const { data } = db.storage.from('product-images').getPublicUrl(fileName);
                    imageUrl = data.publicUrl;
                } else if (!id) { throw new Error('La foto de portada principal es obligatoria.'); }

                const galleryInput = document.getElementById('prod-gallery-files');
                let galleryUrls = [];
                if (galleryInput.files.length > 0) {
                    for (let file of galleryInput.files) {
                        const optimized = await compressImage(file);
                        const fileName = `gal-${Date.now()}-${optimized.name}`;
                        await db.storage.from('product-images').upload(fileName, optimized);
                        const { data } = db.storage.from('product-images').getPublicUrl(fileName);
                        galleryUrls.push(data.publicUrl);
                    }
                }

                const productData = {
                    name: document.getElementById('prod-name').value,
                    brand: document.getElementById('prod-brand').value,
                    category: document.getElementById('prod-cat').value,
                    price: parseFloat(document.getElementById('prod-price').value),
                    old_price: document.getElementById('prod-old-price').value ? parseFloat(document.getElementById('prod-old-price').value) : null,
                    stock: parseInt(document.getElementById('prod-stock').value) || 10,
                    sizes: document.getElementById('prod-sizes').value || null,
                    colors: document.getElementById('prod-colors').value || null,
                    image_url: imageUrl,
                    description: document.getElementById('prod-desc').value
                };

                if (galleryUrls.length > 0) productData.gallery_urls = galleryUrls;

                if (id) await db.from('products').update(productData).eq('id', id);
                else await db.from('products').insert([productData]);

                alert('¡Guardado con éxito!');
                resetForm();
                switchTab('inventory-tab');
            } catch (err) { alert('Error: ' + err.message); btn.innerText = 'Guardar y Publicar en la Web'; btn.disabled = false; }
        }

        // CARGAR INVENTARIO CON FECHA
        async function loadAdminProducts() {
            const { data } = await db.from('products').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('admin-products-list');
            if (!data || !data.length) { container.innerHTML = '<p class="text-gray-400 text-center py-6">Sin productos.</p>'; return; }
            
            container.innerHTML = data.map(p => {
                const fecha = new Date(p.created_at).toLocaleDateString('es-PE', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="flex items-center justify-between bg-[#0b0f19] border border-gray-800 p-4 rounded-xl">
                        <div class="flex items-center space-x-4">
                            <img src="${p.image_url}" class="w-14 h-14 object-cover rounded-lg border border-[#d4af37]/30">
                            <div>
                                <h3 class="font-semibold text-white">${p.name}</h3>
                                <p class="text-xs text-gray-400">S/ ${p.price} ${p.old_price ? `(Antes S/ ${p.old_price})` : ''} • Stock: ${p.stock}</p>
                                <p class="text-[10px] text-[#d4af37] mt-1">Publicado el: ${fecha}</p>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick='editProduct(${JSON.stringify(p)})' class="bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500 hover:text-white px-3 py-1.5 rounded-lg text-xs transition">Editar</button>
                            <button onclick="deleteProduct('${p.id}')" class="bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs transition">Eliminar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editProduct(p) {
            switchTab('form-tab');
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-brand').value = p.brand;
            document.getElementById('prod-cat').value = p.category;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-old-price').value = p.old_price || '';
            document.getElementById('prod-stock').value = p.stock || 10;
            document.getElementById('prod-sizes').value = p.sizes || '';
            document.getElementById('prod-colors').value = p.colors || '';
            document.getElementById('prod-desc').value = p.description || '';
            document.getElementById('prod-existing-main').value = p.image_url;
            document.getElementById('form-title').innerText = '✏️ Editar: ' + p.name;
            document.getElementById('btn-save').innerText = 'Actualizar Producto';
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // GUARDAR O EDITAR BANNERS DEL CARRUSEL
        async function savePromo(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-promo-save');
            btn.innerText = 'Guardando banner...'; btn.disabled = true;
            try {
                const id = document.getElementById('promo-id').value;
                const fileInput = document.getElementById('promo-file');
                let imageUrl = document.getElementById('promo-existing-img').value;

                if (fileInput.files.length > 0) {
                    const optimized = await compressImage(fileInput.files[0]);
                    const fileName = `promo-${Date.now()}-${optimized.name}`;
                    await db.storage.from('product-images').upload(fileName, optimized);
                    const { data } = db.storage.from('product-images').getPublicUrl(fileName);
                    imageUrl = data.publicUrl;
                } else if (!id) { throw new Error('La imagen del banner es obligatoria.'); }

                const promoData = {
                    title: document.getElementById('promo-title').value,
                    subtitle: document.getElementById('promo-subtitle').value,
                    old_price: document.getElementById('promo-old').value ? parseFloat(document.getElementById('promo-old').value) : null,
                    new_price: document.getElementById('promo-new').value ? parseFloat(document.getElementById('promo-new').value) : null,
                    image_url: imageUrl
                };

                if (id) await db.from('promotions').update(promoData).eq('id', id);
                else await db.from('promotions').insert([promoData]);

                alert('¡Banner de carrusel guardado con éxito!');
                resetPromoForm();
                loadAdminPromos();
            } catch (err) { alert('Error: ' + err.message); btn.innerText = 'Guardar Banner en Carrusel'; btn.disabled = false; }
        }

        async function loadAdminPromos() {
            const { data } = await db.from('promotions').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('admin-promos-list');
            if (!data || !data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No hay banners activos.</p>'; return; }
            container.innerHTML = data.map(b => `
                <div class="flex items-center justify-between bg-[#0b0f19] p-3 rounded-xl border border-gray-800">
                    <div class="flex items-center space-x-3">
                        <img src="${b.image_url}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-white text-sm">${b.title}</h4>
                            <p class="text-xs text-gray-400">${b.subtitle}</p>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick='editPromo(${JSON.stringify(b)})' class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-3 py-1 rounded text-xs">Editar</button>
                        <button onclick="deletePromo('${b.id}')" class="bg-red-500/10 border border-red-500/30 text-red-400 px-3 py-1 rounded text-xs">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function editPromo(b) {
            document.getElementById('promo-id').value = b.id;
            document.getElementById('promo-title').value = b.title;
            document.getElementById('promo-subtitle').value = b.subtitle;
            document.getElementById('promo-old').value = b.old_price || '';
            document.getElementById('promo-new').value = b.new_price || '';
            document.getElementById('promo-existing-img').value = b.image_url;
            document.getElementById('promo-form-title').innerText = '✏️ Editar Banner: ' + b.title;
            document.getElementById('btn-promo-save').innerText = 'Actualizar Banner';
            document.getElementById('btn-promo-cancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetPromoForm() {
            document.querySelector('#promo-tab form').reset();
            document.getElementById('promo-id').value = '';
            document.getElementById('promo-existing-img').value = '';
            document.getElementById('promo-form-title').innerText = '📢 Crear / Editar Banner del Carrusel';
            document.getElementById('btn-promo-save').innerText = 'Guardar Banner en Carrusel';
            document.getElementById('btn-promo-save').disabled = false;
            document.getElementById('btn-promo-cancel').classList.add('hidden');
        }

        async function deletePromo(id) { if (confirm('¿Eliminar banner del carrusel?')) { await db.from('promotions').delete().eq('id', id); loadAdminPromos(); } }
        async function deleteProduct(id) { if (confirm('¿Eliminar producto?')) { await db.from('products').delete().eq('id', id); loadAdminProducts(); } }
        function resetForm() { document.querySelector('#form-tab form').reset(); document.getElementById('prod-id').value = ''; document.getElementById('prod-existing-main').value = ''; document.getElementById('form-title').innerText = '🛍️ Registrar Producto o Artículo'; document.getElementById('btn-save').innerText = 'Guardar y Publicar en la Web'; document.getElementById('btn-cancel').classList.add('hidden'); }
    </script>
</body>
</html>
