<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Essência Perfumería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0f19; color: #fdfbf7; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-8">
        <!-- HEADER -->
        <div class="flex justify-between items-center border-b border-[#d4af37]/20 pb-6">
            <div>
                <h1 class="text-3xl font-serif text-[#d4af37]">Panel de Control</h1>
                <p class="text-sm text-gray-400">Gestión de Anuncios, Promociones e Inventario - Essência</p>
            </div>
            <a href="index.html" class="bg-[#131b2e] border border-[#d4af37]/40 text-[#d4af37] px-4 py-2 rounded-xl text-sm hover:bg-[#d4af37]/10 transition">Ver Tienda Web ↗</a>
        </div>

        <!-- PESTAÑAS -->
        <div class="flex flex-wrap gap-2 border-b border-gray-800 pb-4">
            <button onclick="switchTab('form-tab')" id="btn-form-tab" class="px-5 py-2 rounded-xl font-semibold bg-[#d4af37] text-black transition">➕ Nuevo Producto</button>
            <button onclick="switchTab('promo-tab')" id="btn-promo-tab" class="px-5 py-2 rounded-xl font-semibold bg-[#131b2e] text-gray-300 hover:text-white transition">📢 Banners y Ofertas</button>
            <button onclick="switchTab('inventory-tab')" id="btn-inventory-tab" class="px-5 py-2 rounded-xl font-semibold bg-[#131b2e] text-gray-300 hover:text-white transition">📦 Inventario</button>
        </div>

        <!-- VISTA 1: NUEVO PRODUCTO -->
        <div id="form-tab" class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
            <h2 id="form-title" class="text-xl font-serif text-[#f3e7c4] mb-4">🛍️ Registrar Producto o Artículo</h2>
            <form onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nombre del Producto *</label>
                    <input type="text" id="prod-name" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Marca / Proveedor *</label>
                    <select id="prod-brand" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                        <option value="Natura">Natura</option>
                        <option value="Ésika">Ésika</option>
                        <option value="L'Bel">L'Bel</option>
                        <option value="Cyzone">Cyzone</option>
                        <option value="Yanbal">Yanbal</option>
                        <option value="General">General / Otro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Categoría *</label>
                    <select id="prod-cat" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                        <option value="Perfumes">Perfumes</option>
                        <option value="Maquillaje">Maquillaje</option>
                        <option value="Cuidado Personal">Cuidado Personal</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Electrodomésticos">Electrodomésticos</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Actual / Oferta (S/) *</label>
                    <input type="number" step="0.01" id="prod-price" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Anterior / Tachado S/ (Opcional)</label>
                    <input type="number" step="0.01" id="prod-old-price" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]" placeholder="Ej. 150.00">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Stock Disponible</label>
                    <input type="number" id="prod-stock" value="10" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div class="md:col-span-2 border-t border-gray-800 pt-4">
                    <label class="block text-xs text-[#d4af37] font-bold mb-1">📸 Foto Principal de Portada (Obligatoria)</label>
                    <input type="file" id="prod-main-file" accept="image/*" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white file:bg-[#d4af37] file:text-black file:rounded-lg file:border-0 file:px-3 file:py-1">
                    <input type="hidden" id="prod-existing-main">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">Descripción Breve</label>
                    <textarea id="prod-desc" rows="2" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]"></textarea>
                </div>
                <div class="md:col-span-2 flex space-x-3 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-[#d4af37] text-black font-semibold py-3 rounded-xl hover:bg-[#f3e7c4] transition shadow-lg">Guardar y Publicar en la Web</button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-700 text-white px-6 py-3 rounded-xl hover:bg-gray-600 transition">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- VISTA 2: BANNERS Y OFERTAS -->
        <div id="promo-tab" class="hidden space-y-6">
            <!-- Creador de Banners Estilo Sentua -->
            <div class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">🎨 Crear Banner Informativo Estilo Sentua</h2>
                <form onsubmit="saveBanner(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Etiqueta Superior (Badge)</label>
                        <input type="text" id="banner-badge" value="ESSÊNCIA CLUB" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Color de Fondo del Banner</label>
                        <select id="banner-color" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                            <option value="#131b2e">Azul Medianoche Lujo (#131b2e)</option>
                            <option value="#1b2a4a">Azul Elegante (#1b2a4a)</option>
                            <option value="#221e1d">Negro Carbón (#221e1d)</option>
                            <option value="#2c221e">Marrón Vintage (#2c221e)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Título Principal del Banner</label>
                        <input type="text" id="banner-title" placeholder="Ej. CONOCE NUESTRO CLUB VIP" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Subtítulo / Descripción</label>
                        <input type="text" id="banner-subtitle" placeholder="Ej. Acumula puntos y cuotas sin intereses" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-[#d4af37] text-black font-semibold py-3 rounded-xl hover:bg-[#f3e7c4] transition">Crear y Publicar Banner en la Web</button>
                    </div>
                </form>
            </div>

            <!-- Listado de Banners Activos -->
            <div class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">📋 Banners Activos</h2>
                <div id="admin-banners-list" class="space-y-3"><p class="text-gray-400 text-center">Cargando...</p></div>
            </div>
        </div>

        <!-- VISTA 3: INVENTARIO -->
        <div id="inventory-tab" class="hidden bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">📦 Historial e Inventario Actual</h2>
            <div id="admin-products-list" class="space-y-3"><p class="text-gray-400 text-center py-6">Cargando inventario...</p></div>
        </div>
    </div>

    <!-- Supabase SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        function switchTab(tabId) {
            ['form-tab', 'promo-tab', 'inventory-tab'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById('btn-' + id).className = 'px-5 py-2 rounded-xl font-semibold bg-[#131b2e] text-gray-300 hover:text-white transition';
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = 'px-5 py-2 rounded-xl font-semibold bg-[#d4af37] text-black transition';

            if(tabId === 'inventory-tab') loadAdminProducts();
            if(tabId === 'promo-tab') loadAdminBanners();
        }

        async function compressImage(file, maxWidth = 900, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(new File([blob], file.name, { type: 'image/jpeg' })); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function saveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.innerText = 'Guardando...'; btn.disabled = true;
            try {
                const id = document.getElementById('prod-id').value;
                const fileInput = document.getElementById('prod-main-file');
                let imageUrl = document.getElementById('prod-existing-main').value;

                if (fileInput.files.length > 0) {
                    const optimized = await compressImage(fileInput.files[0]);
                    const fileName = `${Date.now()}-${optimized.name}`;
                    await db.storage.from('product-images').upload(fileName, optimized);
                    const { data } = db.storage.from('product-images').getPublicUrl(fileName);
                    imageUrl = data.publicUrl;
                } else if (!id) { throw new Error('La foto de portada es obligatoria.'); }

                const data = {
                    name: document.getElementById('prod-name').value,
                    brand: document.getElementById('prod-brand').value,
                    category: document.getElementById('prod-cat').value,
                    price: parseFloat(document.getElementById('prod-price').value),
                    old_price: document.getElementById('prod-old-price').value ? parseFloat(document.getElementById('prod-old-price').value) : null,
                    stock: parseInt(document.getElementById('prod-stock').value) || 10,
                    image_url: imageUrl,
                    description: document.getElementById('prod-desc').value
                };

                if (id) await db.from('products').update(data).eq('id', id);
                else await db.from('products').insert([data]);

                alert('¡Guardado con éxito!');
                resetForm();
                switchTab('inventory-tab');
            } catch (err) { alert('Error: ' + err.message); btn.innerText = 'Guardar y Publicar en la Web'; btn.disabled = false; }
        }

        async function saveBanner(e) {
            e.preventDefault();
            const data = {
                badge: document.getElementById('banner-badge').value,
                title: document.getElementById('banner-title').value,
                subtitle: document.getElementById('banner-subtitle').value,
                bg_color: document.getElementById('banner-color').value
            };
            const { error } = await db.from('banners').insert([data]);
            if (error) alert('Error al crear banner');
            else { alert('¡Banner creado con éxito!'); e.target.reset(); loadAdminBanners(); }
        }

        async function loadAdminBanners() {
            const { data } = await db.from('banners').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('admin-banners-list');
            if (!data || !data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No hay banners.</p>'; return; }
            container.innerHTML = data.map(b => `
                <div class="flex justify-between items-center bg-[#0b0f19] p-3 rounded-xl border border-gray-800">
                    <div><h4 class="font-bold text-white">${b.title}</h4><p class="text-xs text-gray-400">${b.subtitle}</p></div>
                    <button onclick="deleteBanner('${b.id}')" class="bg-red-500/10 text-red-400 px-3 py-1 rounded text-xs">Eliminar</button>
                </div>
            `).join('');
        }

        async function deleteBanner(id) {
            await db.from('banners').delete().eq('id', id);
            loadAdminBanners();
        }

        async function loadAdminProducts() {
            const { data } = await db.from('products').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('admin-products-list');
            if (!data || !data.length) { container.innerHTML = '<p class="text-gray-400 text-center py-6">Sin productos.</p>'; return; }
            container.innerHTML = data.map(p => `
                <div class="flex items-center justify-between bg-[#0b0f19] border border-gray-800 p-4 rounded-xl">
                    <div class="flex items-center space-x-4">
                        <img src="${p.image_url}" class="w-12 h-12 object-cover rounded-lg">
                        <div><h3 class="font-semibold text-white">${p.name}</h3><p class="text-xs text-gray-400">S/ ${p.price} ${p.old_price ? `(Antes S/ ${p.old_price})` : ''}</p></div>
                    </div>
                    <button onclick="deleteProduct('${p.id}')" class="bg-red-500/10 text-red-400 px-3 py-1 rounded-xs text-xs">Eliminar</button>
                </div>
            `).join('');
        }

        async function deleteProduct(id) {
            if (confirm('¿Eliminar producto?')) { await db.from('products').delete().eq('id', id); loadAdminProducts(); }
        }

        function resetForm() { document.querySelector('form').reset(); document.getElementById('prod-id').value = ''; }
    </script>
</body>
</html>
