<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Essência Perfumería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0f19; color: #fdfbf7; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-4xl mx-auto space-y-10">
        <div class="flex justify-between items-center border-b border-[#d4af37]/20 pb-6">
            <div>
                <h1 class="text-3xl font-serif text-[#d4af37]">Panel de Control</h1>
                <p class="text-sm text-gray-400">Gestión de Promociones y Catálogo - Essência</p>
            </div>
            <a href="index.html" class="bg-[#131b2e] border border-[#d4af37]/40 text-[#d4af37] px-4 py-2 rounded-xl text-sm hover:bg-[#d4af37]/10 transition">Ver Tienda Web ↗</a>
        </div>

        <!-- SECCIÓN 1: AGREGAR PROMOCIÓN AL CARRUSEL -->
        <div class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">📢 Crear Banner de Promoción (Carrusel)</h2>
            <form onsubmit="savePromo(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Título (Ej. ¡Extendimos el Cyber!)</label>
                    <input type="text" id="promo-title" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Subtítulo (Ej. HASTA 60% OFF en FRAGANCIAS)</label>
                    <input type="text" id="promo-subtitle" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Anterior S/ (Opcional)</label>
                    <input type="number" step="0.01" id="promo-old" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Oferta S/ (Opcional)</label>
                    <input type="number" step="0.01" id="promo-new" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">Imagen del Banner (Se comprimirá automáticamente)</label>
                    <input type="file" id="promo-file" accept="image/*" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-[#d4af37] file:text-black">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="btn-promo" class="w-full bg-[#d4af37] text-black font-semibold py-3 rounded-xl hover:bg-[#f3e7c4] transition">Publicar Promoción en Carrusel</button>
                </div>
            </form>
        </div>

        <!-- SECCIÓN 2: AGREGAR PRODUCTO AL CATÁLOGO -->
        <div class="bg-[#131b2e] border border-[#d4af37]/30 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-serif text-[#f3e7c4] mb-4">🛍️ Agregar Producto al Catálogo</h2>
            <form onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nombre del Producto</label>
                    <input type="text" id="prod-name" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Marca</label>
                    <select id="prod-brand" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                        <option value="Natura">Natura</option>
                        <option value="Ésika">Ésika</option>
                        <option value="L'Bel">L'Bel</option>
                        <option value="Cyzone">Cyzone</option>
                        <option value="Yanbal">Yanbal</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Categoría</label>
                    <input type="text" id="prod-cat" value="Perfumes" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio (S/)</label>
                    <input type="number" step="0.01" id="prod-price" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">Foto del Producto (Compresión Inteligente)</label>
                    <input type="file" id="prod-file" accept="image/*" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-[#d4af37] file:text-black">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">Descripción Breve</label>
                    <textarea id="prod-desc" rows="2" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-[#d4af37]"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="btn-prod" class="w-full bg-[#d4af37] text-black font-semibold py-3 rounded-xl hover:bg-[#f3e7c4] transition">Publicar Producto</button>
                </div>
            </form>
        </div>

    </div>

    <!-- Supabase y Lógica de Compresión -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        // FUNCIÓN INTELIGENTE DE COMPRESIÓN DE IMÁGENES
        async function compressImage(file, maxWidth = 900, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function uploadCompressedImage(file, bucket) {
            const optimizedFile = await compressImage(file);
            const fileName = `${Date.now()}-${optimizedFile.name}`;
            const { data, error } = await supabase.storage.from(bucket).upload(fileName, optimizedFile);
            if (error) throw error;
            const { data: publicUrl } = supabase.storage.from(bucket).getPublicUrl(fileName);
            return publicUrl.publicUrl;
        }

        async function savePromo(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-promo');
            btn.innerText = 'Comprimiendo y publicando...';
            btn.disabled = true;

            try {
                const file = document.getElementById('promo-file').files[0];
                const imageUrl = await uploadCompressedImage(file, 'product-images');

                const { error } = await supabase.from('promotions').insert([{
                    title: document.getElementById('promo-title').value,
                    subtitle: document.getElementById('promo-subtitle').value,
                    old_price: document.getElementById('promo-old').value ? parseFloat(document.getElementById('promo-old').value) : null,
                    new_price: document.getElementById('promo-new').value ? parseFloat(document.getElementById('promo-new').value) : null,
                    image_url: imageUrl
                }]);

                if (error) throw error;
                alert('¡Promoción publicada en el carrusel con éxito!');
                e.target.reset();
            } catch (err) {
                alert('Error: ' + err.message);
            }
            btn.innerText = 'Publicar Promoción en Carrusel';
            btn.disabled = false;
        }

        async function saveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-prod');
            btn.innerText = 'Comprimiendo y publicando...';
            btn.disabled = true;

            try {
                const file = document.getElementById('prod-file').files[0];
                const imageUrl = await uploadCompressedImage(file, 'product-images');

                const { error } = await supabase.from('products').insert([{
                    name: document.getElementById('prod-name').value,
                    brand: document.getElementById('prod-brand').value,
                    category: document.getElementById('prod-cat').value,
                    price: parseFloat(document.getElementById('prod-price').value),
                    image_url: imageUrl,
                    description: document.getElementById('prod-desc').value
                }]);

                if (error) throw error;
                alert('¡Producto agregado al catálogo correctamente!');
                e.target.reset();
            } catch (err) {
                alert('Error: ' + err.message);
            }
            btn.innerText = 'Publicar Producto';
            btn.disabled = false;
        }
    </script>
</body>
</html>
